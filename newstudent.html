<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - Smart Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-protected>
    <!-- HEADER -->
    <div class="topbar">
        <h1>Smart Attendance</h1>
        <div>
            <span id="whoami" style="margin-right:15px;color:#a8b0c8;font-size:13px;"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h3>Menu</h3>
            <a href="newdashboard.html">📊 Dashboard</a>
            <a href="newstudent.html">👨‍🎓 Students</a>
            <a href="newattendance.html">📝 Attendance</a>
            <a href="newreport.html">📄 Reports</a>
            <a href="newadmin.html" data-role="admin">⚙️ Admin</a>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <h1>Student Records</h1>
            <p class="subtitle">Search, add and manage students</p>

            <div class="toolbar">
                <input type="text" id="studentSearch" placeholder="Search student..." onkeyup="searchStudents()">
                <button onclick="addStudent()">+ Add Student</button>
            </div>

            <div class="section" style="margin-top:0">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Section</th>
                            <th>Attendance</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
